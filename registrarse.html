<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
</head>
<body>
    <div class="container">
    <h2>Crear Cuenta</h2>
    <!-- Formulario de registro -->
    <!-- action="/register": ruta donde se enviarán los datos mediante POST al servidor -->
    <!-- Cada input debe tener un 'name' que el backend espere para procesar los datos -->
    <form action="/register" method="POST">
            <div class="form-group">
                <!-- Nombre completo del usuario (campo obligatorio) -->
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Ej: Juan Pérez">
            </div>
            
            <div class="form-group">
                <!-- Correo electrónico: se valida en cliente (formato) y debe validarse también en servidor -->
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" required placeholder="ejemplo@correo.com">
            </div>
            
            <div class="form-group">
                <!-- Número de teléfono: se filtran los caracteres no numéricos en el script y se exige longitud mínima -->
                <label for="numero">Número de teléfono:</label>
                <input type="tel" id="numero" name="numero" required placeholder="+1234567890">
            </div>
            
            <div class="form-group">
                <!-- Contraseña: el atributo minlength ayuda en el cliente, pero el servidor debe aplicar hashing (password_hash) -->
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required minlength="6">
                <small>La contraseña debe tener al menos 6 caracteres</small>
            </div>
            
            <div class="form-group">
                <!-- Confirmación de contraseña: se compara con 'password' en el script para evitar errores de usuario -->
                <label for="confirm-password">Confirmar contraseña:</label>
                <input type="password" id="confirm-password" name="confirm-password" required minlength="6">
            </div>
            
            <button type="submit">Registrarse</button>
        </form>
        
    <p class="login-link">¿Ya tienes cuenta? <a class="btn-login" href="inicio_sesion.html">Inicia sesión</a></p>
    </div>

    <style>
    /* Estilos principales: definen la disposición del formulario, inputs y botones */
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #dee2f3 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        
        h2 {
            margin-bottom: 25px;
            color: #333;
            font-size: 28px;
        }
        
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        
        input:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        input:invalid {
            border-color: #e74c3c;
        }
        
        small {
            color: #888;
            font-size: 12px;
            display: block;
            margin-top: 5px;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .login-link {
            margin-top: 20px;
            color: #666;
        }
        /* Estilo para que el enlace de iniciar sesión parezca un botón (igual que en inicio_sesion.html) */
        .btn-login {
            display: inline-block;
            padding: 8px 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            margin-left: 8px;
        }
        .btn-login:focus,
        .btn-login:hover {
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }
        
        a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        
        a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 20px;
                margin: 10px;
            }
            
            h2 {
                font-size: 24px;
            }
        }
    </style>

    <script>
        // Scripts de validación del formulario (cliente)
        // 1) Comprobar que contraseña y confirmación coinciden
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirm-password');
        const submitBtn = document.querySelector('button[type="submit"]');

        // Función que valida si las contraseñas coinciden y habilita/deshabilita el botón
        function validatePasswordMatch() {
            if (confirmPassword.value && password.value !== confirmPassword.value) {
                // Si no coinciden, se establece un error personalizado en el input
                confirmPassword.setCustomValidity('Las contraseñas no coinciden');
                submitBtn.disabled = true; // prevenimos envío accidental
            } else {
                // Si coinciden o confirmPassword está vacío, se limpia el error
                confirmPassword.setCustomValidity('');
                submitBtn.disabled = false;
            }
        }

        // Escuchar cambios en ambos campos de contraseña
        confirmPassword.addEventListener('input', validatePasswordMatch);
        password.addEventListener('input', validatePasswordMatch);

        // 2) Validación de formato de email en tiempo real (ayuda al usuario)
        const emailInput = document.getElementById('email');
        emailInput.addEventListener('input', function() {
            const email = this.value;
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (email && !emailRegex.test(email)) {
                // Mensaje que aparece si el formato no es válido
                this.setCustomValidity('Por favor ingrese un correo válido');
            } else {
                this.setCustomValidity('');
            }
        });

        // 3) Validación básica del teléfono: mantener solo números y exigir longitud mínima
        const phoneInput = document.getElementById('numero');
        phoneInput.addEventListener('input', function() {
            const phone = this.value.replace(/\D/g, ''); // Elimina todo lo que no sea dígito
            this.value = phone; // Actualiza el input para mostrar solo números
            if (phone.length < 10) {
                this.setCustomValidity('El número debe tener al menos 10 dígitos');
            } else {
                this.setCustomValidity('');
            }
        });
    </script>
</body>
</html>
